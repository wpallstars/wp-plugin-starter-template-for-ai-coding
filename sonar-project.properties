# SonarCloud (SonarQube Cloud) analysis, run by .github/workflows/sonarcloud.yml.
# Automatic analysis must be off for the project: it ignores this file.
# The workflow sets sonar.organization and sonar.projectKey from the
# repository ({owner} and {owner}_{repo}), so this file names no plugin.

sonar.sources=.
sonar.exclusions=vendor/**,dist/**,node_modules/**,docs/metrics/**,composer.lock
sonar.php.file.suffixes=php

# Rules that WordPress coding standards (phpcs.xml.dist) contradict. The
# free plan cannot give a project its own Quality Profile, so they are
# ignored here instead.
sonar.issue.ignore.multicriteria=s100,s101,s116,s1142,s1172a,s1172b,s1448a,s1448b,s6807,s6819a,s6819b
# Method names: WordPress uses snake_case.
sonar.issue.ignore.multicriteria.s100.ruleKey=php:S100
sonar.issue.ignore.multicriteria.s100.resourceKey=**/*.php
# Class names: WordPress uses Prefix_Name.
sonar.issue.ignore.multicriteria.s101.ruleKey=php:S101
sonar.issue.ignore.multicriteria.s101.resourceKey=**/*.php
# Field names: snake_case properties.
sonar.issue.ignore.multicriteria.s116.ruleKey=php:S116
sonar.issue.ignore.multicriteria.s116.resourceKey=**/*.php
# Return count: the code uses early-return guards.
sonar.issue.ignore.multicriteria.s1142.ruleKey=php:S1142
sonar.issue.ignore.multicriteria.s1142.resourceKey=**/*.php

# Intended, scoped to the files where they are by design.
# Unused parameters: setting renderers and sanitizers are picked from a map by
# field type and share one signature, so some ignore an argument.
sonar.issue.ignore.multicriteria.s1172a.ruleKey=php:S1172
sonar.issue.ignore.multicriteria.s1172a.resourceKey=admin/includes/class-settings-manager.php
sonar.issue.ignore.multicriteria.s1172b.ruleKey=php:S1172
sonar.issue.ignore.multicriteria.s1172b.resourceKey=includes/class-wpstarter-settings.php
# Method count: the settings store is the static API features call, and the
# updater is one file every plugin carries. Splitting them would change the
# core-file layout of every plugin.
sonar.issue.ignore.multicriteria.s1448a.ruleKey=php:S1448
sonar.issue.ignore.multicriteria.s1448a.resourceKey=includes/class-wpstarter-settings.php
sonar.issue.ignore.multicriteria.s1448b.ruleKey=php:S1448
sonar.issue.ignore.multicriteria.s1448b.resourceKey=includes/github-updater/class-wpallstars-github-updater.php
# role="switch" on a native checkbox: its checked state is the switch state,
# and ARIA in HTML says not to add aria-checked to it.
sonar.issue.ignore.multicriteria.s6807.ruleKey=Web:S6807
sonar.issue.ignore.multicriteria.s6807.resourceKey=admin/includes/class-settings-manager.php
# role="status" (a live region; <output> is announced unevenly) and
# role="group" on navigation links (<fieldset> is for form controls).
sonar.issue.ignore.multicriteria.s6819a.ruleKey=Web:S6819
sonar.issue.ignore.multicriteria.s6819a.resourceKey=admin/includes/class-settings-manager.php
sonar.issue.ignore.multicriteria.s6819b.ruleKey=Web:S6819
sonar.issue.ignore.multicriteria.s6819b.resourceKey=admin/includes/class-admin-manager.php
