---
# Codacy: files it does not analyse. composer.lock is generated by Composer;
# assets/build/ by the JavaScript build, whose sources in packages/ are
# analysed. ESLint and PHP Mess Detector read .eslintrc.json and
# phpmd.xml.dist (DEVELOPMENT.md → Services setup).
exclude_paths:
  - "composer.lock"
  - "assets/build/**"
