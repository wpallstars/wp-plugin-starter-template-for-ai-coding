# SonarCloud automatic analysis.
#
# WordPress coding standards (phpcs.xml.dist) name functions and methods in
# snake_case and classes as Prefix_Name, and the code returns early from
# guards. These SonarCloud rules want the opposite, so they are not reported:
#   php:S100  method names in camelCase
#   php:S101  class names in PascalCase without underscores
#   php:S116  field names in camelCase
#   php:S1142 at most 3 returns in a function
sonar.issue.ignore.multicriteria=s100,s101,s116,s1142
sonar.issue.ignore.multicriteria.s100.ruleKey=php:S100
sonar.issue.ignore.multicriteria.s100.resourceKey=**/*.php
sonar.issue.ignore.multicriteria.s101.ruleKey=php:S101
sonar.issue.ignore.multicriteria.s101.resourceKey=**/*.php
sonar.issue.ignore.multicriteria.s116.ruleKey=php:S116
sonar.issue.ignore.multicriteria.s116.resourceKey=**/*.php
sonar.issue.ignore.multicriteria.s1142.ruleKey=php:S1142
sonar.issue.ignore.multicriteria.s1142.resourceKey=**/*.php
