# The stars-over-time chart at the end of README.md
# (docs/assets/star-history.svg), redrawn weekly and committed to main with
# SYNC_PAT (GitHub only shows when stars were given to collaborators).
#
# The work is the aidevops reusable workflow (https://aidevops.sh), pinned
# with its helper scripts to the same aidevops commit as repo-metrics.yml;
# update both together.
name: Update Star History

on:
  schedule:
    - cron: '17 3 * * 0'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  update:
    uses: marcusquinn/aidevops/.github/workflows/star-history-reusable.yml@821b82a18712bb74b72ec9b55d9ae0a98adb46e9 # v3.39.1
    permissions:
      contents: write
    with:
      aidevops_ref: 821b82a18712bb74b72ec9b55d9ae0a98adb46e9 # v3.39.1, the same commit as uses:
    secrets:
      SYNC_PAT: ${{ secrets.SYNC_PAT }}
