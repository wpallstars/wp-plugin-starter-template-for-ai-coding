# GitHub release from a version tag (RELEASING.md → GitHub release): push a
# vX.Y.Z tag on main and this builds the zip from the tag, checks it, and
# publishes the release with the zip as its one plugin asset. In a public
# repository it also signs Sigstore build provenance for the zip and attaches
# the bundle as provenance-{slug}-X.Y.Z.sigstore.json; a name that does not
# start with the slug, since Git Updater installs the first asset that does.
# Private repositories get the release without provenance (attestations
# there need GitHub Enterprise Cloud).
#
# Tags with letters (v1.2.0-rc1) are not released here; make those by hand
# as pre-releases. Release notes are the version's section of the README.md
# changelog; edit them on GitHub afterwards if needed.
name: Release

on:
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+"]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Build, attest and publish
    # GitHub-hosted unless CI_RUNNER names a self-hosted label (ci.yml).
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 20
    permissions:
      contents: write # create the release
      id-token: write # sign the provenance (Sigstore)
      attestations: write # store the attestation
    env:
      TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: "7.4"
          coverage: none
          tools: none

      - name: Check the tag
        id: plugin
        run: |
          if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::$TAG is not a plain version tag (vX.Y.Z)"
            exit 1
          fi
          if ! git merge-base --is-ancestor "$TAG" origin/main; then
            echo "::error::$TAG is not on main; release only from main"
            exit 1
          fi
          # shellcheck source=scripts/lib/plugin.sh disable=SC1091
          . scripts/lib/plugin.sh
          plugin_identity "$TAG"
          {
            echo "slug=$PLUGIN_SLUG"
            echo "name=$PLUGIN_NAME"
            echo "version=${TAG#v}"
          } >>"$GITHUB_OUTPUT"

      - name: Preflight
        run: scripts/preflight-release.sh --ref "$TAG" --offline --no-docker

      - name: Build both zips
        run: scripts/build-release.sh --ref "$TAG" --out dist

      - name: Attest build provenance
        id: attest
        if: github.event.repository.private == false
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/${{ steps.plugin.outputs.slug }}-${{ steps.plugin.outputs.version }}.zip

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          SLUG: ${{ steps.plugin.outputs.slug }}
          NAME: ${{ steps.plugin.outputs.name }}
          VERSION: ${{ steps.plugin.outputs.version }}
          BUNDLE: ${{ steps.attest.outputs.bundle-path }}
        run: |
          assets=("dist/$SLUG-$VERSION.zip")
          # The version's section of the README.md changelog.
          awk -v h="### $VERSION" '
            $0 == h { on = 1; next }
            on && /^##/ { exit }
            on { print }' README.md >dist/notes.md
          if [[ ! -s dist/notes.md ]]; then
            echo "::error::README.md has no changelog section ### $VERSION"
            exit 1
          fi
          if [[ -n "$BUNDLE" ]]; then
            cp "$BUNDLE" "dist/provenance-$SLUG-$VERSION.sigstore.json"
            assets+=("dist/provenance-$SLUG-$VERSION.sigstore.json")
            printf '\n%s\n' "Built and signed by GitHub Actions. Check the zip with: \`gh attestation verify $SLUG-$VERSION.zip --repo $GITHUB_REPOSITORY\`" >>dist/notes.md
          fi
          if gh release view "$TAG" >/dev/null 2>&1; then
            # Made by hand first: replace its zip with this signed build.
            gh release upload "$TAG" "${assets[@]}" --clobber
          else
            gh release create "$TAG" "${assets[@]}" --verify-tag \
              --title "$NAME $VERSION" --notes-file dist/notes.md
          fi
